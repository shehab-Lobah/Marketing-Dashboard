name: Refresh paid media data

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "43 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Inclusive lookback window
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: refresh-paid-media
  cancel-in-progress: false

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAID_ACCOUNT_MAPPING_JSON: ${{ secrets.PAID_ACCOUNT_MAPPING_JSON }}
      BRAND_MAPPING_PATH: data_pipeline/brand_mapping.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$META_ACCESS_TOKEN" && -n "$META_GRAPH_API_VERSION" && -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$PAID_ACCOUNT_MAPPING_JSON" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Paid-media sync is not configured yet; skipping."
          fi

      - name: Set up Python
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install --quiet -r data_pipeline/requirements.txt

      - name: Materialize account mapping
        if: steps.config.outputs.ready == 'true'
        run: python -c 'import os, pathlib; pathlib.Path(os.environ["BRAND_MAPPING_PATH"]).write_text(os.environ["PAID_ACCOUNT_MAPPING_JSON"], encoding="utf-8")'

      - name: Synchronize Meta
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          days="${{ inputs.days }}"
          if [[ -z "$days" ]]; then days=7; fi
          if [[ "${{ github.event.schedule }}" == "43 0 * * *" ]]; then days=30; fi
          python -m data_pipeline.sync_paid --platform meta --days "$days"

      - name: Remove account mapping
        if: always()
        run: rm -f data_pipeline/brand_mapping.json

