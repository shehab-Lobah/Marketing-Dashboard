name: Discover Meta ad accounts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          test -n "$META_ACCESS_TOKEN" || { echo "META_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$META_GRAPH_API_VERSION" || { echo "META_GRAPH_API_VERSION is missing"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r data_pipeline/requirements.txt

      - name: List accessible accounts
        run: python -m data_pipeline.discover_meta
